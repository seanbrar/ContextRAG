name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Load cached venv
        id: cached-uv-dependencies
        uses: actions/cache@v4
        with:
          path: |
            .venv
            ~/.cache/uv
          key: uv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml') }}

      - name: Install dependencies
        if: steps.cached-uv-dependencies.outputs.cache-hit != 'true'
        run: uv sync --all-extras

      - name: Lint
        run: uv run ruff check src tests

      - name: Typecheck
        run: uv run mypy src/contextrag

      - name: Run tests
        run: uv run pytest tests/ -v --cov=contextrag --cov-report=term-missing --cov-fail-under=95

  smoke-eval:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Load cached venv
        id: cached-uv-dependencies
        uses: actions/cache@v4
        with:
          path: |
            .venv
            ~/.cache/uv
          key: uv-${{ runner.os }}-3.12-${{ hashFiles('**/pyproject.toml') }}

      - name: Install dependencies
        if: steps.cached-uv-dependencies.outputs.cache-hit != 'true'
        run: uv sync --all-extras

      - name: Validate datasets
        run: |
          uv run contextrag validate-dataset --dataset data/demo
          uv run contextrag validate-dataset --dataset data/eval-expanded

      - name: Run offline demo smoke
        run: uv run contextrag demo --output runs/ci_demo.json --run-dir runs/ci_demo

      - name: Run compare smoke
        run: uv run contextrag compare --run-a runs/ci_demo --run-b runs/ci_demo --output runs/ci_compare.json
