[project]
name = "ContextRAG"
version = "0.0.1"
description = "Provider-agnostic RAG evaluation framework with reproducible benchmarking."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Sean Brar", email = "hello@seanbrar.com" }]
keywords = ["rag", "retrieval-augmented generation", "evaluation", "embeddings"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "chromadb~=1.4.1",
    "chromaroute~=0.2.3",
    "click~=8.3.1",
    "openai~=2.15.0",
    "python-dotenv~=1.2.1",
    "pyyaml~=6.0.2",
    "tiktoken~=0.12.0",
    "sentence-transformers (>=5.2.0,<6.0.0)",
]

[project.optional-dependencies]
dev = [
    "isort>=7.0.0",
    "mypy>=1.15.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.13",
]

[project.urls]
Homepage = "https://github.com/seanbrar/ContextRAG"
Repository = "https://github.com/seanbrar/ContextRAG"
Issues = "https://github.com/seanbrar/ContextRAG/issues"

[project.scripts]
contextrag = "contextrag.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/contextrag"]

[tool.ruff]
exclude = [".archive/"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
exclude = [".archive/", "chromaroute/"]

[[tool.mypy.overrides]]
module = [
    "chromadb.*",
    "chromaroute.*",
    "tiktoken.*",
    "sentence_transformers.*",
    "yaml.*",
    "requests.*",
    "requests",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
check_untyped_defs = false
disallow_untyped_defs = false
disallow_incomplete_defs = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
